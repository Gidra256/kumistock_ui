<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KumiStock - Product Catalog</title>
    <link rel="stylesheet" href="KumiStock/styles.css">
    <link rel="icon" href="images/logo.png">
    <style>
        .product-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }

        .product-card {
            background: white;
            width: 220px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 15px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .product-card h3 {
            margin: 10px 0 5px 0;
        }

        .btn-contact {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background: linear-gradient(90deg, #1e88e5, #42a5f5);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-contact:hover {
            background: linear-gradient(90deg, #1565c0, #1976d2);
            transform: translateY(-2px);
        }

        /* Search bar styling */
        #catalog-search {
            padding: 10px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 20px auto;
            border-radius: 8px;
            border: 1px solid #ccc;
            display: block;
        }
    </style>
</head>

<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="logo">KumiStock</div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Catalog</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
        </ul>
        <div class="hamburger"><span></span><span></span><span></span></div>
    </nav>

    <!-- ===== CONTAINER ===== -->
    <div class="container">
        <h1>Product Catalog</h1>

        <!-- ===== SEARCH BAR ===== -->
        <input type="text" id="catalog-search" placeholder="🔍 Search products...">

        <!-- ===== PRODUCT CARDS ===== -->
        <div class="product-cards" id="product-cards"></div>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer style="text-align:center; padding:20px; color:#666;">
        © 2025 KumiStock | Designed with ❤️ in Kumi
    </footer>

    <!-- ===== SCRIPT ===== -->
    <script src="js/app.js"></script>
    <script>
        const productCards = document.getElementById('product-cards');
        const searchInput = document.getElementById('catalog-search');

        // Load products from localStorage
        let products = JSON.parse(localStorage.getItem('products')) || [];

        function displayProducts(productsArray) {
            productCards.innerHTML = '';

            if (productsArray.length === 0) {
                productCards.innerHTML = "<p style='text-align:center; color:#999;'>No products available.</p>";
                return;
            }

            productsArray.forEach((p) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${p.image || 'images/placeholder.png'}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <p><strong>Supplier:</strong> ${p.supplier || "Unknown"}</p>
                    <p><strong>Price:</strong> UGX ${p.price}</p>
                    <p><strong>Available Qty:</strong> ${p.qty}</p>
                    <a href="https://wa.me/256XXXXXXXXX?text=Hello,%20I%20am%20interested%20in%20${encodeURIComponent(p.name)}" 
                       target="_blank" class="btn-contact">Contact Owner</a>
                `;
                productCards.appendChild(card);
            });
        }

        displayProducts(products);

        // ===== SEARCH FUNCTIONALITY =====
        searchInput.addEventListener('input', function () {
            const query = this.value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query));
            displayProducts(filtered);
        });

        // ===== HAMBURGER MENU =====
        const hamburger = document.querySelector(".hamburger");
        const navLinks = document.querySelector(".nav-links");
        hamburger.addEventListener("click", () => {
            navLinks.classList.toggle("show");
        });
    </script>

</body>

</html>
