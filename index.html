<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KumiStock - Smart Inventory Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">KumiStock</div>
    <div class="menu-toggle" id="menu-toggle">&#9776;</div>
    <ul class="nav-links" id="nav-links">
      <li><a href="#dashboard">Dashboard</a></li>
      <li><a href="#add-product">Add Product</a></li>
      <li><a href="#record-sale">Record Sale</a></li>
      <li><a href="#reports">Reports</a></li>
    </ul>
  </nav>

  <section id="login" class="page active">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Enter username" />
    <input type="password" id="password" placeholder="Enter password" />
    <button onclick="login()">Login</button>
  </section>

  <section id="dashboard" class="page">
    <h2>Dashboard</h2>
    <div class="card"><h3>Total Sales</h3><p id="total-sales">0 UGX</p></div>
    <div class="card"><h3>Total Profit</h3><p id="total-profit">0 UGX</p></div>
    <div class="card"><h3>Low Stock</h3><p id="low-stock">0 Items</p></div>
  </section>

  <section id="add-product" class="page">
    <h2>Add Product</h2>
    <input type="text" id="product-name" placeholder="Product Name" />
    <input type="number" id="cost-price" placeholder="Cost Price" />
    <input type="number" id="selling-price" placeholder="Selling Price" />
    <input type="number" id="quantity" placeholder="Quantity" />
    <button onclick="addProduct()">Add Product</button>
  </section>

  <section id="record-sale" class="page">
    <h2>Record Sale</h2>
    <select id="product-select"></select>
    <input type="number" id="quantity-sold" placeholder="Quantity Sold" />
    <button onclick="recordSale()">Record</button>
  </section>

  <section id="reports" class="page">
    <h2>Reports</h2>
    <div id="report-output"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
