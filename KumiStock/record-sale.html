<div class="container">
  <h1>Record Sale</h1>
  <form id="record-sale-form">
    <select id="product-select"></select>
    <input type="number" id="quantity-sold" placeholder="Quantity Sold" required>
    <button type="submit">Record Sale</button>
  </form>
</div>
<script src="app.js"></script>
<script>
updateProductSelect();
document.getElementById('record-sale-form').addEventListener('submit', function(e){
    e.preventDefault();
    recordSale();
    alert('Sale recorded!');
    this.reset();
});
</script>
